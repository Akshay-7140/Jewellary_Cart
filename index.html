  <title>Shubh Jewels — Premium Indian Jewellery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fdf8ef',
              100: '#f9edd4',
              200: '#f0d9a8',
              300: '#e4be6e',
              400: '#d4a017',
              500: '#b8860b',
              600: '#9a6b09',
              700: '#7c520c',
              800: '#664210',
              900: '#563712',
            },
            maroon: {
              500: '#8B0000',
              600: '#6B0000',
              700: '#4A0000',
            },
            cream: '#fdf8f0',
            deep: '#1a120b',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Poppins', 'system-ui', 'sans-serif'],

        },
      },
    };

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Poppins', system-ui, sans-serif; background: #fdf8f0; margin: 0; }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .product-card:hover .product-img { transform: scale(1.06); }
    .product-img { transition: transform 0.55s ease; }
    .cart-panel { transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1); }
    .cart-overlay { transition: opacity 0.3s ease; }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge-pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f1e9d8; }
    ::-webkit-scrollbar-thumb { background: #d4a017; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Indian Jewellery Products with ₹ prices
    const PRODUCTS = [
      {
        id: 1,
        name: "Kundan Bridal Necklace Set",
        category: "Necklaces",
        price: 45999,
        originalPrice: 54999,
        image: "https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=600&h=600&fit=crop",
        description: "22K gold-plated Kundan set with pearl drops. Perfect for weddings.",
        badge: "Bestseller",
      },
      {
        id: 2,
        name: "Temple Gold Jhumkas",
        category: "Earrings",
        price: 8999,
        originalPrice: 10999,
        image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=600&h=600&fit=crop",
        description: "Traditional South Indian temple design jhumkas in antique gold finish.",
        badge: "Sale",
      },
      {
        id: 3,
        name: "Diamond Solitaire Ring",
        category: "Rings",
        price: 78999,
        originalPrice: null,
        image: "https://images.unsplash.com/photo-1605100804763-247f995f979a?w=600&h=600&fit=crop",
        description: "18K white gold solitaire with 0.75ct certified diamond.",
        badge: "Premium",
      },
      {
        id: 4,
        name: "Polki Choker Set",
        category: "Necklaces",
        price: 32999,
        originalPrice: 38999,
        image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600&h=600&fit=crop",
        description: "Uncut Polki diamonds set in 22K gold with matching earrings.",
        badge: "Limited",
      },
      {
        id: 5,
        name: "Meenakari Bangles (Pair)",
        category: "Bangles",
        price: 12499,
        originalPrice: 14999,
        image: "https://images.unsplash.com/photo-1573408301185-9146fe634ad0?w=600&h=600&fit=crop",
        description: "Hand-painted Meenakari work on pure gold-plated bangles.",
        badge: "Sale",
      },
      {
        id: 6,
        name: "Emerald Drop Earrings",
        category: "Earrings",
        price: 18999,
        originalPrice: null,
        image: "https://images.unsplash.com/photo-1588444837495-c6cfeb53a4c6?w=600&h=600&fit=crop",
        description: "Colombian emerald drops set in 18K rose gold with diamonds.",
        badge: "New",
      },
      {
        id: 7,
        name: "Antique Gold Mangalsutra",
        category: "Necklaces",
        price: 24999,
        originalPrice: 28999,
        image: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=600&h=600&fit=crop",
        description: "Traditional black beads with antique gold pendant & chain.",
        badge: "Popular",
      },
      {
        id: 8,
        name: "Ruby Cocktail Ring",
        category: "Rings",
        price: 34999,
        originalPrice: null,
        image: "https://images.unsplash.com/photo-1603561591411-07134e71a2a9?w=600&h=600&fit=crop",
        description: "Burmese ruby center stone with diamond halo in 18K gold.",
        badge: "Exclusive",
      },
    ];

    const CATEGORIES = ["All", "Necklaces", "Earrings", "Rings", "Bangles"];
    const WHATSAPP_NUMBER = "918767857140"; // +91 8767857140

    function formatINR(amount) {
      return "₹" + amount.toLocaleString("en-IN");
    }

    function App() {
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem("shubh-cart");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [toast, setToast] = useState(null);
      const [customerName, setCustomerName] = useState("");
      const [customerPhone, setCustomerPhone] = useState("");

      useEffect(() => {
        localStorage.setItem("shubh-cart", JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        if (toast) {
          const t = setTimeout(() => setToast(null), 2500);
          return () => clearTimeout(t);
        }
      }, [toast]);

      const filteredProducts = useMemo(() => {
        return PRODUCTS.filter((p) => {
          const matchCat = selectedCategory === "All" || p.category === selectedCategory;
          const matchSearch =
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.description.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [selectedCategory, searchQuery]);

      const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const cartTotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      const addToCart = (product) => {
        setCart((prev) => {
          const existing = prev.find((i) => i.id === product.id);
          if (existing) {
            return prev.map((i) =>
              i.id === product.id ? { ...i, qty: i.qty + 1 } : i
            );
          }
          return [...prev, { ...product, qty: 1 }];
        });
        setToast(product.name + " added to bag ✨");
      };

      const updateQty = (id, delta) => {
        setCart((prev) =>
          prev
            .map((i) => (i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i))
            .filter((i) => i.qty > 0)
        );
      };

      const removeFromCart = (id) => {
        setCart((prev) => prev.filter((i) => i.id !== id));
      };

      const clearCart = () => setCart([]);

      // Generate WhatsApp Bill Message
      const generateBillMessage = () => {
        const date = new Date().toLocaleString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

        let message = `✨ *SHUBH JEWELS - ORDER BILL* ✨\n`;
        message += `━━━━━━━━━━━━━━━━━━━━\n`;
        message += `📅 Date: ${date}\n`;
        if (customerName) message += `👤 Customer: ${customerName}\n`;
        if (customerPhone) message += `📞 Phone: ${customerPhone}\n`;
        message += `━━━━━━━━━━━━━━━━━━━━\n\n`;
        message += `*ORDER DETAILS:*\n\n`;

        cart.forEach((item, index) => {
          message += `${index + 1}. *${item.name}*\n`;
          message += `   Qty: ${item.qty} × ${formatINR(item.price)}\n`;
          message += `   = ${formatINR(item.price * item.qty)}\n\n`;
        });

        message += `━━━━━━━━━━━━━━━━━━━━\n`;
        message += `💰 *TOTAL AMOUNT: ${formatINR(cartTotal)}*\n`;
        message += `━━━━━━━━━━━━━━━━━━━━\n\n`;
        message += `🙏 Thank you for shopping with Shubh Jewels!\n`;
        message += `We will confirm your order shortly.`;

        return message;
      };

      const sendBillOnWhatsApp = () => {
        if (cart.length === 0) return;

        const message = generateBillMessage();
        const encoded = encodeURIComponent(message);
        const whatsappURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`;

        // Open WhatsApp
        window.open(whatsappURL, "_blank");

        setToast("Opening WhatsApp to send bill... 📱");
        
        // Clear cart after short delay
        setTimeout(() => {
          clearCart();
          setIsCartOpen(false);
          setCustomerName("");
          setCustomerPhone("");
          setToast("Bill sent successfully! 🎉");
        }, 1500);
      };

      return (
        <div className="min-h-screen bg-cream text-deep">
          {/* Toast */}
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-deep text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium fade-in max-w-[90vw] text-center">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-50 bg-cream/95 backdrop-blur-md border-b border-gold-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 md:h-20">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center shadow-md">
                    <span className="text-white text-xl font-serif font-bold">श</span>
                  </div>
                  <div>
                    <h1 className="font-serif text-xl md:text-2xl font-semibold tracking-tight">
                      Shubh Jewels
                    </h1>
                    <p className="text-[10px] tracking-[0.25em] uppercase text-gold-600 -mt-0.5 hidden sm:block">
                      Since 1998 • Authentic Gold
                    </p>
                  </div>
                </div>

                <div className="hidden md:flex flex-1 max-w-md mx-8">
                  <div className="relative w-full">
                    <input
                      type="text"
                      placeholder="Search jewellery..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-10 pr-4 py-2.5 rounded-full border border-gold-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-gold-400/60 focus:border-gold-400 transition"
                    />
                    <svg className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                  </div>
                </div>

                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative flex items-center gap-2 px-4 py-2.5 rounded-full bg-deep text-white hover:bg-gold-700 transition-colors shadow-md"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                  </svg>
                  <span className="text-sm font-medium hidden sm:inline">Bag</span>
                  {cartCount > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-maroon-500 text-white text-xs font-bold rounded-full flex items-center justify-center badge-pulse">
                      {cartCount}
                    </span>
                  )}
                </button>
              </div>

              <div className="md:hidden pb-3">
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Search jewellery..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 rounded-full border border-gold-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-gold-400/60"
                  />
                  <svg className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </div>
              </div>
            </div>
          </header>

          {/* Hero Section */}
          <section className="relative overflow-hidden bg-gradient-to-br from-deep via-[#2a1f14] to-gold-900 text-white">
            <div className="absolute inset-0 opacity-25">
              <div className="absolute top-0 right-0 w-80 h-80 bg-gold-400 rounded-full blur-3xl"></div>
              <div className="absolute bottom-0 left-10 w-96 h-96 bg-maroon-500 rounded-full blur-3xl opacity-40"></div>
            </div>
            <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 md:py-22 flex flex-col md:flex-row items-center gap-10">
              <div className="flex-1 text-center md:text-left">
                <p className="text-gold-300 text-sm tracking-[0.35em] uppercase mb-3 font-medium">
                  Authentic Indian Craftsmanship
                </p>
                <h2 className="font-serif text-4xl sm:text-5xl lg:text-6xl font-medium leading-tight mb-4">
                  Jewellery that<br />
                  <span className="italic text-gold-300">tells your story</span>
                </h2>
                <p className="text-white/75 max-w-md mx-auto md:mx-0 mb-8 text-base leading-relaxed">
                  From traditional Kundan to modern diamonds — handcrafted pieces for every celebration of life.
                </p>
                <div className="flex flex-col sm:flex-row gap-3 justify-center md:justify-start">
                  <a
                    href="#collection"
                    className="inline-flex items-center justify-center gap-2 px-7 py-3.5 bg-gold-500 hover:bg-gold-400 text-deep font-semibold rounded-full transition shadow-lg shadow-gold-500/30"
                  >
                    Shop Collection
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                  </a>
                  <a
                    href={`https://wa.me/${WHATSAPP_NUMBER}`}
                    target="_blank"
                    className="inline-flex items-center justify-center gap-2 px-6 py-3.5 border-2 border-gold-400 text-gold-300 hover:bg-gold-400 hover:text-deep font-medium rounded-full transition"
                  >
                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885
